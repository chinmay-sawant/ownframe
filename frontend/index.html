<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Build desktop and mobile apps with HTML, CSS, and Go. OwnFrame uses Blinkless, our HTML and CSS engine built from scratch, and Ebitengine for drawing and windows." />
    <script>
      try {
        const theme = localStorage.getItem('ownframe:theme') || localStorage.getItem('go-gpui:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <title>ownframe | HTML screens, Go logic</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
