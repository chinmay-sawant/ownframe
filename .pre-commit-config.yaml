# GEN-10: local secret scanning. Install with
#   pip install pre-commit && pre-commit install
# CI runs the same gitleaks config on every push and PR.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
