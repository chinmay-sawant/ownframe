<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS masking</title>
  <style>
    body { margin: 0; background: #f4f4f0; color: #17212b; font: 14px sans-serif; }
    h1 { position: absolute; left: 20px; top: 8px; font-size: 20px; }
    .label { position: absolute; font-weight: bold; }
    .backdrop { position: absolute; width: 160px; height: 100px; background-image: url("assets/coast.jpg"); background-size: cover; background-position: center; background-repeat: no-repeat; }
    .mask { position: absolute; left: 0; top: 0; width: 160px; height: 100px; background-image: url("assets/flowers.jpg"); background-size: cover; background-position: center; background-repeat: no-repeat; }
    #luminance-back, #svg-back { background-image: url("assets/flowers.jpg"); }
    #luminance, #svg-mask { background-image: url("assets/coast.jpg"); }
    #alpha-back { left: 20px; top: 68px; }
    #luminance-back { left: 280px; top: 68px; }
    #composite-back { left: 20px; top: 230px; }
    #svg-back { left: 280px; top: 230px; }
    #alpha-label { left: 20px; top: 42px; }
    #luminance-label { left: 280px; top: 42px; }
    #composite-label { left: 20px; top: 204px; }
    #svg-label { left: 280px; top: 204px; }
    #property-list { position: absolute; left: 20px; top: 340px; width: 420px; font-size: 12px; }
    #alpha { mask: url("assets/alpha-half.png") 0% 0% / 100% 100% no-repeat border-box; mask-mode: alpha; mask-origin: border-box; mask-clip: border-box; }
    #luminance { mask-image: url("assets/luminance-half.png"); mask-mode: luminance; mask-position: 50% 50%; mask-size: 100% 100%; mask-repeat: no-repeat; mask-origin: border-box; mask-clip: border-box; }
    #composite { mask-image: url("assets/alpha-half.png"), url("assets/luminance-half.png"); mask-mode: alpha, luminance; mask-composite: exclude, add; mask-position: 0% 0%, 100% 0%; mask-size: 80% 100%; mask-repeat: no-repeat, no-repeat; mask-origin: border-box; mask-clip: border-box; }
    #svg-mask { mask-image: url("assets/mask-type.svg#luma"); mask-mode: match-source; mask-position: 0% 0%; mask-size: 100% 100%; mask-repeat: no-repeat; mask-origin: border-box; mask-clip: border-box; }
  </style>
</head>
<body>
  <h1>CSS masking in OwnFrame</h1>
  <div class="label" id="alpha-label">alpha mask</div>
  <div class="label" id="luminance-label">luminance mask</div>
  <div class="backdrop" id="alpha-back"><div class="mask" id="alpha"></div></div>
  <div class="backdrop" id="luminance-back"><div class="mask" id="luminance"></div></div>
  <div class="label" id="composite-label">two layers and exclude</div>
  <div class="label" id="svg-label">SVG luminance mask</div>
  <div class="backdrop" id="composite-back"><div class="mask" id="composite"></div></div>
  <div class="backdrop" id="svg-back"><div class="mask" id="svg-mask"></div></div>
  <div id="property-list">Properties: mask, mask-clip, mask-composite, mask-image, mask-mode, mask-origin, mask-position, mask-repeat, mask-size, and SVG mask-type.</div>
</body>
</html>
