<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Theme studio</title>
<style>
  html, body { margin: 0; }
  body {
    display: flex;
    align-items: stretch;
    min-height: 100vh;
    background: #f2efe9;
    color: #26231d;
    font-family: sans-serif;
    font-size: 14px;
  }
  .editor {
    display: flex;
    flex-direction: column;
    flex: none;
    width: 450px;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 12px;
    background: #ece8df;
    border-right: 1px solid #d5d0c5;
  }
  .bar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .bar h1 { margin: 0 8px 0 0; font-size: 15px; color: #26231d; }
  .tool {
    border: 1px solid #b9b2a4;
    background: #faf8f4;
    color: #26231d;
    border-radius: 6px;
    padding: 6px 11px;
    font-family: sans-serif;
    font-size: 13px;
  }
  .tool:hover { background: #ffffff; border: 1px solid #8f887a; }
  #btn-apply { background: #1a56db; border: 1px solid #1a56db; color: #ffffff; }
  #btn-apply:hover { background: #1749b8; border: 1px solid #1749b8; }
  #css {
    display: block;
    box-sizing: border-box;
    width: 100%;
    height: 300px;
    background: #ffffff;
    color: #26231d;
    border: 1px solid #b9b2a4;
    border-radius: 6px;
    padding: 10px;
    font-family: monospace;
    font-size: 12px;
    line-height: 17px;
    white-space: pre-wrap;
  }
  #css[data-ownframe-focus="1"] { border: 1px solid #1a56db; padding: 10px; outline: 1px solid #1a56db; }
  .status { margin-top: 8px; color: #4b463c; font-size: 12px; }
  .tokens { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tok {
    display: flex;
    align-items: center;
    gap: 5px;
    background: #faf8f4;
    border: 1px solid #ded9cd;
    border-radius: 5px;
    padding: 3px 7px;
    font-size: 11px;
    color: #3a362e;
  }
  .tok b { font-weight: 700; }
  .swatch { display: inline-block; width: 10px; height: 10px; border: 1px solid #c4beb0; border-radius: 2px; }
</style>
</head>
<body>
  <div id="editor" class="editor">
    <div class="bar">
      <h1>Theme studio</h1>
      <button id="btn-apply" class="tool">Apply</button>
      <button id="btn-copy" class="tool">Copy</button>
      <button id="btn-reset" class="tool">Reset</button>
      <button id="preset-light" class="tool">Light</button>
      <button id="preset-dark" class="tool">Dark</button>
      <button id="preset-amber" class="tool">Amber</button>
      <button id="preset-paper" class="tool">Paper</button>
    </div>
    <textarea id="css" class="css-field">{{.Editor}}</textarea>
    <div class="status">Status <span id="status">{{.Status}}</span></div>
    <div id="tokens" class="tokens">{{range .Tokens}}<span class="tok"><i class="swatch" style="{{.Style}}"></i><b>{{.Name}}</b>: {{.Value}}</span>{{end}}</div>
  </div>
  <!-- preview -->
</body>
</html>
