<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flappy Bird</title>
<style>
  /* The Ebiten canvas fills document.body, and the engine reads the body
     size as the layout viewport. Pinning the body to the 480x720 stage
     keeps the browser canvas exactly the desktop window: same boxes, same
     paint, same hit testing. Ebiten writes its own inline body styles at
     startup, so the stage size needs !important to survive them. */
  html, body { height: 100%; }
  html {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  body {
    flex: none !important;
    width: 480px !important;
    height: 720px !important;
    max-width: 100vw;
    max-height: 100vh;
    margin: 0 !important;
    background: #000;
    overflow: hidden;
  }
</style>
</head>
<body>
<script src="wasm_exec.js"></script>
<script>
const go = new Go();
WebAssembly.instantiateStreaming(fetch("ownframe.wasm"), go.importObject).then(function (result) {
  go.run(result.instance);
});
</script>
</body>
</html>
