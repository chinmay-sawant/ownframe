{{if .Phone}}<div class="bottom" style="top:{{.BottomTop}}px">{{end}}
<nav class="tabs">
  <div id="tab-chats" class="tab{{if eq .Tab "chats"}} on{{end}}" data-action="tab-chats">Chats {{if gt .Unread 0}}<span class="badge tabcount" data-action="tab-chats">{{.Unread}}</span>{{end}}</div>
  <div id="tab-contacts" class="tab{{if eq .Tab "contacts"}} on{{end}}" data-action="tab-contacts">Contacts</div>
  <div id="tab-settings" class="tab{{if eq .Tab "settings"}} on{{end}}" data-action="tab-settings">Settings</div>
</nav>
{{if .Phone}}
  <div class="navpad" style="height:{{.InsetBottom}}px"></div>
</div>
<div class="statuspad" style="top:{{.PadTop}}px;height:{{.InsetTop}}px"></div>
{{end}}
