apply plugin: 'com.android.application'

android {
    namespace 'com.chinmaysawant.telegram'
    compileSdk 34

    defaultConfig {
        applicationId "com.chinmaysawant.telegram"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName '0.0.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Release hardening: R8 minifies and shrinks the demo APK.
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
        }
    }
}

dependencies {
    implementation project(':telegram')
    implementation project(':android-host')
}
