<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Departure board</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    padding: 18px 28px 24px;
    background: var(--bg, #191104);
    color: var(--fg, #ffb000);
    font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
  }
  header {
    display: flex;
    align-items: baseline;
    padding-bottom: 12px;
    margin-bottom: 16px;
    border-bottom: 2px solid var(--border, #6b4a12);
  }
  h1 { margin: 0; font-size: 24px; letter-spacing: 2px; }
  #clock {
    margin-left: 18px;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent, #ff9d00);
  }
  #status { margin-left: 14px; font-size: 13px; color: var(--muted, #b98a3a); }
  .controls { margin-left: auto; }
  .controls button {
    margin-left: 6px;
    padding: 6px 11px;
    font: inherit;
    font-size: 12px;
    color: var(--muted, #b98a3a);
    background: var(--tile-bg, #241704);
    border: 1px solid var(--border, #6b4a12);
    border-radius: var(--radius, 3px);
  }
  .controls button.on { color: var(--bg, #191104); background: var(--accent, #ff9d00); }
  #refresh {
    height: 8px;
    margin-bottom: 18px;
    background: var(--tile-bg, #241704);
    border-radius: var(--radius, 3px);
  }
  #refresh-fill {
    display: block;
    width: 100%;
    height: 8px;
    background: var(--accent, #ff9d00);
    border-radius: var(--radius, 3px);
  }
  .row { display: flex; align-items: center; margin: 6px 0; overflow: hidden; }
  .tile {
    display: inline-block;
    flex: none;
    width: 22px;
    height: 40px;
    margin: 0 1px;
    overflow: hidden;
    font-size: 24px;
    font-weight: 700;
    line-height: 40px;
    text-align: center;
    white-space: pre;
    color: var(--tile-fg, #ffcf6b);
    background: var(--tile-bg, #241704);
    border: 1px solid var(--border, #6b4a12);
    border-radius: var(--radius, 3px);
  }
  .tile.time { width: 24px; color: var(--accent, #ff9d00); }
  .tile.gap { width: 14px; margin: 0; border: 0; background: transparent; }
</style>
</head>
<body>
<header>
  <h1>{{.Title}}</h1>
  <span id="clock">{{.Clock}}</span>
  <span id="status">{{.Status}}</span>
  <div class="controls">
    <button type="button" id="livery-amber" class="livery{{if eq $.Livery "amber"}} on{{end}}">Amber</button>
    <button type="button" id="livery-flap" class="livery{{if eq $.Livery "flap"}} on{{end}}">Flap</button>
    <button type="button" id="livery-lcd" class="livery{{if eq $.Livery "lcd"}} on{{end}}">LCD</button>
    <button type="button" id="livery-paper" class="livery{{if eq $.Livery "paper"}} on{{end}}">Paper</button>
    <button type="button" id="btn-night">{{if .Night}}Day{{else}}Night{{end}}</button>
    <button type="button" id="btn-pause">{{if .Paused}}Resume{{else}}Pause{{end}}</button>
  </div>
</header>
<div id="refresh"><i id="refresh-fill"></i></div>
<main>
{{range $i, $row := .Rows}}<div class="row" id="row-{{$i}}">{{range $row.Cells}}<span class="tile {{.Kind}}" id="{{.ID}}">{{.Ch}}</span>{{end}}</div>
{{end}}</main>
</body>
</html>
