apply plugin: 'com.android.application'

android {
    namespace 'com.chinmaysawant.depthalert'
    compileSdk 34

    defaultConfig {
        applicationId "com.chinmaysawant.depthalert"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':depth-alert')
    implementation project(':android-host')
    implementation 'com.google.ar:core:1.56.0'
}
