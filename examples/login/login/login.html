<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #f4f1ea;
    font-family: sans-serif;
    color: #1c1915;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card { width: 320px; background: #ffffff; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .error { color: #9b2335; font-size: 13px; min-height: 18px; margin: 0; }
  .status { color: #176b45; font-size: 13px; min-height: 18px; margin: 0; }
  label { display: block; font-size: 13px; margin-top: 12px; }
  .field {
    display: block;
    box-sizing: border-box;
    width: 100%;
    border: 1px solid #c8c2b4;
    padding: 8px;
    margin-top: 4px;
    min-height: 18px;
  }
  .field[data-ownframe-focus="1"] { border: 1px solid #1a56db; padding: 8px; outline: 1px solid #1a56db; }
  .field[data-ownframe-placeholder="1"] { color: #8a8578; }
  #login {
    display: block;
    border: 0;
    margin-top: 16px;
    background: #1a56db;
    color: #ffffff;
    padding: 10px;
    text-align: center;
  }
  #login[disabled] { background: #e3ded4; color: #8a8578; }
</style>
</head>
<body>
  <div id="card" class="card">
    <h1>Sign in</h1>
    <p id="message" class="{{if .Status}}status{{else}}error{{end}}">{{if .Status}}{{.Status}}{{else}}{{.Error}}{{end}}</p>
    <label>Email</label>
    <input id="email" type="text" class="field" placeholder="Email" data-bind="Email">
    <label>Password</label>
    <input id="password" type="password" class="field" placeholder="Password" data-bind="Password">
    <button id="login" data-action="login"{{if not .Ready}} disabled{{end}}>Sign in</button>
  </div>
</body>
</html>
