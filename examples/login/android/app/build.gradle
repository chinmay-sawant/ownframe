apply plugin: 'com.android.application'

android {
    namespace 'com.chinmaysawant.login'
    compileSdk 34
    defaultConfig {
        applicationId 'com.chinmaysawant.login'
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName '0.0.2'
    }
    buildTypes {
        debug {
            // A debug build installs beside a signed release build: Android
            // refuses to replace an app with one signed by a different key.
            applicationIdSuffix '.debug'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':login')
    implementation project(':android-host')
}
