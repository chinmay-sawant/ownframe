// Top-level build file. AGP 8.5.1 or higher is needed to 16 KB zip-align
// uncompressed shared libraries, which is what the generated AAR carries.
buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.1'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}
