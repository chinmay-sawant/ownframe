<header class="titlebar" id="titlebar">
  <span class="win-dots" aria-hidden="true"><span class="wd wd-r"></span><span class="wd wd-y"></span><span class="wd wd-g"></span></span>

  <button class="brand" data-action="mode-explorer" type="button" title="Beacon code view">
    <span class="brand-mark">
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-linejoin="round">
        <path d="M10 1.8 18 6v8l-8 4.2L2 14V6z" stroke-width="1.35"/>
        <path d="M10 1.8v16.4M2 6l8 4.3L18 6" stroke-width="1" opacity=".5"/>
      </svg>
    </span>
    <span class="brand-name">Beacon</span>
    <span class="brand-sub">code view</span>
  </button>

  <button class="cmdbar" data-action="focus-filter" type="button" title="Focus the file filter">
    <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="6" cy="6" r="4.1"/>
      <path d="m9.2 9.2 3 3"/>
    </svg>
    <span class="cmd-text">{{if eq .Mode "changes"}}{{if .Diff.Selected}}{{.Diff.Selected}}{{else}}Working tree{{end}}{{else if .Active}}{{.Active}}{{else}}Filter files by name{{end}}</span>
    <span class="cmd-key">F</span>
  </button>

  <div class="title-actions">
    <button class="branch-pill" data-action="mode-changes" type="button" title="Source control">
      <svg width="11" height="12" viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <circle cx="2.6" cy="2.8" r="1.7"/><circle cx="2.6" cy="11.2" r="1.7"/><circle cx="9.4" cy="5" r="1.7"/>
        <path d="M2.6 4.5v5M9.4 6.7c0 2.2-2.4 2.4-4.4 3"/>
      </svg>
      <span>{{.Branch}}</span>
      {{if .Changed}}<span class="branch-count">{{.Changed}}</span>{{end}}
    </button>
    <button class="title-btn{{if .Details}} on{{end}}" data-action="details-toggle" type="button" title="Toggle details">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
        <rect x="1.6" y="2.4" width="12.8" height="11.2" rx="1.6"/>
        <path d="M10 2.4v11.2"/>
      </svg>
    </button>
    <button class="title-btn{{if .DevOn}} on{{end}}" data-action="devtools" type="button" title="Toggle developer tools">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M5.2 4.6a3 3 0 0 1 5.6 0M8 8v1.2"/>
        <circle cx="8" cy="8" r="6.1"/>
        <path d="M4.4 10.4 2 11.6M11.6 10.4 14 11.6M4.8 6.2 2.8 4.8M11.2 6.2l2-1.4"/>
      </svg>
    </button>
  </div>
</header>
