<header class="titlebar" id="titlebar">
  <button class="file-btn" id="file-menu" data-action="file-menu-open" type="button" title="File menu" aria-label="File menu" aria-expanded="{{if .FileMenu}}true{{else}}false{{end}}"{{if .Modal}} tabindex="-1"{{end}}>
    <span class="file-label">File</span>
  </button>

  <button class="brand" id="brand" data-action="mode-explorer" type="button" title="Code Review"{{if .Modal}} tabindex="-1"{{end}}>
    <span class="brand-mark">
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke-linejoin="round">
        <path d="M10 1.8 18 6v8l-8 4.2L2 14V6z" stroke-width="1.35"/>
        <path d="M10 1.8v16.4M2 6l8 4.3L18 6" stroke-width="1" opacity=".5"/>
      </svg>
    </span>
    <span class="brand-name">Code Review</span>
    <span class="brand-sub">workspace</span>
  </button>

  <button class="cmdbar" id="cmdbar" data-action="palette-open" type="button" title="Quick open (Ctrl+P)"{{if .Modal}} tabindex="-1"{{end}}>
    <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke-width="1.5" stroke-linecap="round">
      <circle cx="6" cy="6" r="4.1"/>
      <path d="m9.2 9.2 3 3"/>
    </svg>
    <span class="cmd-text">{{if eq .Mode "changes"}}{{if .Diff.Selected}}{{.Diff.Selected}}{{else}}Working tree{{end}}{{else if .Active}}{{.Active}}{{else}}Search files{{end}}</span>
    <span class="cmd-key">Ctrl P</span>
  </button>

</header>
