<header class="titlebar" id="titlebar">
  <button class="file-btn" id="file-menu" data-action="file-menu-open" type="button" title="File menu" aria-label="File menu" aria-expanded="{{if .FileMenu}}true{{else}}false{{end}}"{{if .Modal}} tabindex="-1"{{end}}>
    <span class="file-label">File</span>
  </button>

  <button class="brand" id="brand" data-action="mode-explorer" type="button" title="Code Review"{{if .Modal}} tabindex="-1"{{end}}>
    <span class="brand-mark">
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke-linejoin="round">
        <path d="M10 1.8 18 6v8l-8 4.2L2 14V6z" stroke-width="1.35"/>
        <path d="M10 1.8v16.4M2 6l8 4.3L18 6" stroke-width="1" opacity=".5"/>
      </svg>
    </span>
    <span class="brand-name">Code Review</span>
    <span class="brand-sub">workspace</span>
  </button>

  <button class="cmdbar" id="cmdbar" data-action="palette-open" type="button" title="Quick open (Ctrl+P)"{{if .Modal}} tabindex="-1"{{end}}>
    <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke-width="1.5" stroke-linecap="round">
      <circle cx="6" cy="6" r="4.1"/>
      <path d="m9.2 9.2 3 3"/>
    </svg>
    <span class="cmd-text" title="{{.CmdTitle}}">{{.CmdText}}</span>
    <span class="cmd-key">Ctrl P</span>
  </button>
  <div class="nav-group" role="group" aria-label="File navigation">
    <button class="nav-btn{{if not .NavBack}} off{{end}}" id="nav-back" data-action="nav-back" type="button" title="{{.NavBackTitle}}" aria-label="Go Back"{{if not .NavBack}} disabled{{end}}{{if .Modal}} tabindex="-1"{{end}}>
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>
    </button>
    <button class="nav-btn{{if not .NavForward}} off{{end}}" id="nav-forward" data-action="nav-forward" type="button" title="{{.NavForwardTitle}}" aria-label="Go Forward"{{if not .NavForward}} disabled{{end}}{{if .Modal}} tabindex="-1"{{end}}>
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>
    </button>
  </div>
{{if .Chrome}}
  <div class="win-controls" id="win-controls">
    <button class="win-btn" id="win-min" data-action="win-min" type="button" title="Minimize" aria-label="Minimize"{{if .Modal}} tabindex="-1"{{end}}>
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke-width="1.3" stroke-linecap="round">
        <path d="M2 6h8"/>
      </svg>
    </button>
{{if .ChromeMax}}
    <button class="win-btn" id="win-max" data-action="win-max" type="button" title="Restore" aria-label="Restore"{{if .Modal}} tabindex="-1"{{end}}>
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke-width="1.1">
        <rect x="3.4" y="1.8" width="6.8" height="6.8" rx="0.5"/>
        <path d="M1.8 3.6V10.2h6.6" stroke-width="1.3"/>
      </svg>
    </button>
{{else}}
    <button class="win-btn" id="win-max" data-action="win-max" type="button" title="Maximize" aria-label="Maximize"{{if .Modal}} tabindex="-1"{{end}}>
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke-width="1.1">
        <rect x="1.8" y="1.8" width="8.4" height="8.4" rx="0.5"/>
      </svg>
    </button>
{{end}}
    <button class="win-btn win-close" id="win-close" data-action="win-close" type="button" title="Close" aria-label="Close"{{if .Modal}} tabindex="-1"{{end}}>
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke-width="1.3" stroke-linecap="round">
        <path d="m2.5 2.5 7 7m0-7-7 7"/>
      </svg>
    </button>
  </div>
{{end}}
</header>
