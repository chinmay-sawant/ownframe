{{if .Palette.Open}}
<div class="palette-layer" id="palette-layer">
  <div class="palette-back" id="palette-back" data-action="palette-close"></div>
  <div class="palette" id="palette-panel">
    <div class="palette-search">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke-width="1.5" stroke-linecap="round">
        <circle cx="6" cy="6" r="4.1"/><path d="m9.2 9.2 3 3"/>
      </svg>
      <input id="palette" class="palette-input" type="text" data-bind="PaletteQuery" placeholder="Search files by name" autocomplete="off" spellcheck="false">
      <button class="palette-close" id="palette-close" data-action="palette-close" type="button" title="Close search" aria-label="Close search">×</button>
    </div>
    <div class="palette-list">
      {{range .Palette.Rows}}
      <button class="palette-row{{if .Active}} on{{end}}" id="palette-{{.Path}}" data-action="open:{{.Path}}" type="button">
        <span class="ficon lang-{{.Lang}}">{{.Badge}}</span>
        <span class="palette-text"><b>{{.Name}}</b><span>{{.Dir}}</span></span>
        <span class="palette-go">↵</span>
      </button>
      {{else}}
      <div class="palette-empty">No file matches this search.</div>
      {{end}}
    </div>
    <div class="palette-foot"><span>{{len .Palette.Rows}} files</span><span>↑↓ choose · Enter open · Esc close</span></div>
  </div>
</div>
{{end}}
