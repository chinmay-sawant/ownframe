<nav class="activity" id="activity" aria-label="Views">
  <button class="act{{if eq .Mode "explorer"}} on{{end}}" id="act-explorer" data-action="mode-explorer" type="button" title="Explorer (1)" aria-label="Explorer"{{if .Modal}} tabindex="-1"{{end}}>
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke-width="1.4" stroke-linejoin="round">
      <path d="M2.4 4.6h5l1.5 2h8.7V16H2.4z"/>
      <path d="M2.4 6.6h15.2" opacity=".5"/>
    </svg>
  </button>
  <button class="act{{if eq .Mode "changes"}} on{{end}}" id="act-changes" data-action="mode-changes" type="button" title="Source control (2)" aria-label="Source control"{{if .Modal}} tabindex="-1"{{end}}>
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke-width="1.4" stroke-linecap="round">
      <circle cx="5" cy="4.4" r="2.1"/><circle cx="5" cy="15.6" r="2.1"/><circle cx="15" cy="7.4" r="2.1"/>
      <path d="M5 6.5v7M15 9.5c0 3.2-3.6 3.4-7.2 4.4"/>
    </svg>
    {{if .Changed}}<span class="act-badge">{{.Changed}}</span>{{end}}
  </button>
  <button class="act" id="act-search" data-action="search-open" type="button" title="Search workspace (Ctrl+Shift+F)" aria-label="Search workspace"{{if .Modal}} tabindex="-1"{{end}}>
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke-width="1.5" stroke-linecap="round">
      <circle cx="8.6" cy="8.6" r="5.8"/>
      <path d="m13 13 4 4"/>
    </svg>
  </button>
  <button class="act{{if .Details}} on{{end}}" id="act-details" data-action="details-toggle" type="button" title="Details (3)" aria-label="Details {{if .Details}}open{{else}}closed{{end}}" aria-pressed="{{if .Details}}true{{else}}false{{end}}"{{if .Modal}} tabindex="-1"{{end}}>
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke-width="1.4">
      <rect x="2.2" y="3.2" width="15.6" height="13.6" rx="1.8"/>
      <path d="M12.6 3.2v13.6"/>
    </svg>
  </button>
  <span class="act-fill"></span>
  <button class="act" id="act-settings" data-action="settings-open" type="button" title="Settings" aria-label="Settings"{{if .Modal}} tabindex="-1"{{end}}>
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke-width="1.5" stroke-linecap="round">
      <path d="M8.4 2h3.2l.5 2a6.3 6.3 0 0 1 1.4.6l1.8-1 2.2 2.2-1 1.8c.3.5.5.9.6 1.4l2 .5v3.2l-2 .5a6.3 6.3 0 0 1-.6 1.4l1 1.8-2.2 2.2-1.8-1a6.3 6.3 0 0 1-1.4.6l-.5 2H8.4l-.5-2a6.3 6.3 0 0 1-1.4-.6l-1.8 1-2.2-2.2 1-1.8a6.3 6.3 0 0 1-.6-1.4l-2-.5V8.4l2-.5a6.3 6.3 0 0 1 .6-1.4l-1-1.8 2.2-2.2 1.8 1a6.3 6.3 0 0 1 1.4-.6z"/><circle cx="10" cy="10" r="2.6"/>
    </svg>
  </button>
  <button class="act{{if .DevOn}} on{{end}}" id="act-devtools" data-action="devtools" type="button" title="Developer tools (F12)" aria-label="Developer tools {{if .DevOn}}on{{else}}off{{end}}" aria-pressed="{{if .DevOn}}true{{else}}false{{end}}"{{if .Modal}} tabindex="-1"{{end}}>
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke-width="1.4" stroke-linecap="round">
      <path d="M6.4 6a4.2 4.2 0 0 1 7.2 0M10 10v1.5"/>
      <circle cx="10" cy="10" r="7.6"/>
      <path d="M5.6 13 2.8 14.4M14.4 13l2.8 1.4M6 8.2 3.4 6.8M14 8.2l2.6-1.4"/>
    </svg>
  </button>
</nav>
