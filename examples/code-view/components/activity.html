<nav class="activity" id="activity" aria-label="Views">
  <button class="act{{if eq .Mode "explorer"}} on{{end}}" data-action="mode-explorer" type="button" title="Explorer (1)">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <path d="M2.4 4.6h5l1.5 2h8.7V16H2.4z"/>
      <path d="M2.4 6.6h15.2" opacity=".5"/>
    </svg>
  </button>
  <button class="act{{if eq .Mode "changes"}} on{{end}}" data-action="mode-changes" type="button" title="Source control (2)">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <circle cx="5" cy="4.4" r="2.1"/><circle cx="5" cy="15.6" r="2.1"/><circle cx="15" cy="7.4" r="2.1"/>
      <path d="M5 6.5v7M15 9.5c0 3.2-3.6 3.4-7.2 4.4"/>
    </svg>
    {{if .Changed}}<span class="act-badge">{{.Changed}}</span>{{end}}
  </button>
  <button class="act" data-action="focus-filter" type="button" title="Filter files">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="8.6" cy="8.6" r="5.8"/>
      <path d="m13 13 4 4"/>
    </svg>
  </button>
  <button class="act{{if .Details}} on{{end}}" data-action="details-toggle" type="button" title="Details (3)">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4">
      <rect x="2.2" y="3.2" width="15.6" height="13.6" rx="1.8"/>
      <path d="M12.6 3.2v13.6"/>
    </svg>
  </button>
  <span class="act-fill"></span>
  <button class="act" data-action="collapse-all" type="button" title="Collapse all folders">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M4 6.4h12M4 10h12M4 13.6h8"/>
    </svg>
  </button>
  <button class="act{{if .DevOn}} on{{end}}" data-action="devtools" type="button" title="Developer tools (F12)">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <path d="M6.4 6a4.2 4.2 0 0 1 7.2 0M10 10v1.5"/>
      <circle cx="10" cy="10" r="7.6"/>
      <path d="M5.6 13 2.8 14.4M14.4 13l2.8 1.4M6 8.2 3.4 6.8M14 8.2l2.6-1.4"/>
    </svg>
  </button>
</nav>
