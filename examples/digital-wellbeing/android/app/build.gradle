apply plugin: 'com.android.application'

android {
    namespace 'com.chinmaysawant.digitalwellbeing'
    compileSdk 34

    defaultConfig {
        applicationId "com.chinmaysawant.digitalwellbeing"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':digital-wellbeing')
    implementation project(':android-host')
}
