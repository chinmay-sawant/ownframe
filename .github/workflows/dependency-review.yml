name: dependency-review

# GEN-7: new Go/npm dependencies and licenses land here before they can
# merge unnoticed. Runs on every PR against the default branch.
on:
  pull_request:
    branches:
      - master

# GEN-9: least privilege; no step comments on PRs, so read-only is enough.
permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      # No actions/dependency-review-action here: it needs the dependency
      # graph API, which answers 403 for this repo, so the action fails
      # every PR with "not supported" before analyzing anything. Re-add it
      # once Settings > Code security enables the graph. Until then the
      # gates below enforce the same properties without the graph API.
      # High-severity CVEs: govulncheck built from the pinned tool
      # directive in go.mod. govulncheck has no workspace mode, so both
      # modules are scanned explicitly.
      - name: Scan Go vulnerabilities in both modules
        run: |
          go build -o "${RUNNER_TEMP}/govulncheck" golang.org/x/vuln/cmd/govulncheck
          "${RUNNER_TEMP}/govulncheck" ./...
          cd examples && "${RUNNER_TEMP}/govulncheck" ./...
      # License inventory for both modules; every new module needs manual
      # provenance review per CONTRIBUTING.md (GEN-8).
      - name: Check Go licenses
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          "$(go env GOPATH)/bin/go-licenses" check ./...
          cd examples && "$(go env GOPATH)/bin/go-licenses" check ./...
      # GEN-7/GEN-8: print the module inventory so reviewers can spot a
      # new or lookalike dependency during the manual provenance review.
      - name: Show Go module inventory
        run: |
          go list -m all
          cd examples && go list -m all
