name: vuln

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# GEN-9: read-only; this workflow only reports.
permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.11"
      # govulncheck loads every package, and the window packages include
      # X11/Xlib.h through cgo. Without the headers it fails while loading.
      - name: Install native compile dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - run: go mod verify
      - run: make vuln
