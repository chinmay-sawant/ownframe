name: ci

on:
  push:
  pull_request:
  workflow_call:

# GEN-9: least privilege; each job gets only what it needs (this file has
# no deploy job, so read-only is enough). Never use pull_request_target
# with a checkout: it would run attacker-controlled code with write tokens.
permissions:
  contents: read

# GEN-1: builds fail if go.sum drifts; never set GONOSUMDB, GOINSECURE,
# GOFLAGS=-insecure, or GOFLAGS=-mod=mod here. GOPRIVATE stays
# unset so the proxy + sumdb verify every module.
# GEN-2: GOTOOLCHAIN=local stops the toolchain from silently upgrading
# itself; update the pinned setup-go version and module go directives together.
env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

# Cancel superseded runs on the same ref so a push does not wait behind a
# pipeline for a commit it already replaced. Release tags run in the
# release workflow, a different workflow name, so they are unaffected.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One-gate validation: a push whose message contains "[ci only=<job>]"
# runs just that job, where <job> is one of test, lint, graphics, module,
# site, test-race, sec, cross, secrets, lint-actions, reproducible,
# examples-race, native-package, performance, or android-bind. The gates
# aggregator stays skipped on those runs and the single job reports for
# itself. Example: git commit -m "[ci only=site] debug CDP startup".

jobs:
  # The old sequential `gates` job, split so test, lint, graphics, module,
  # and site run in parallel. Wall time is now the slowest gate rather
  # than the sum of all five.
  test:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[ci only=') ||
      contains(github.event.head_commit.message, '[ci only=test]')
    runs-on: ubuntu-latest
    steps:
      # Pinned by full SHA (GEN-9); the trailing comment names the tag the
      # SHA was resolved from so bumps stay reviewable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      # GEN-1: fail the build when the module cache disagrees with go.sum.
      - run: go mod verify
      - run: cd examples && go mod verify
      - name: Install graphics test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - run: xvfb-run -a make test

  lint:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[ci only=') ||
      contains(github.event.head_commit.message, '[ci only=lint]')
    runs-on: ubuntu-latest
    steps:
      # Pinned by full SHA (GEN-9); the trailing comment names the tag the
      # SHA was resolved from so bumps stay reviewable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # GEN-5: --ignore-scripts blocks install-time code execution;
      # lockfile-only installs (npm ci) plus signature audit below.
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm audit signatures
        working-directory: frontend
      # scripts/lint.sh compiles golangci-lint from source into temp/tools
      # on a cache miss; reuse the exact pinned binary across runs.
      - name: Read pinned linter version
        id: lint-version
        run: echo "version=$(grep '^GOLANGCI_LINT_VERSION' Makefile | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: temp/tools
          key: golangci-lint-${{ runner.os }}-${{ steps.lint-version.outputs.version }}
      - run: make lint

  graphics:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[ci only=') ||
      contains(github.event.head_commit.message, '[ci only=graphics]')
    runs-on: ubuntu-latest
    steps:
      # Pinned by full SHA (GEN-9); the trailing comment names the tag the
      # SHA was resolved from so bumps stay reviewable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      - name: Install graphics test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - run: make graphics-check

  module:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[ci only=') ||
      contains(github.event.head_commit.message, '[ci only=module]')
    runs-on: ubuntu-latest
    steps:
      # Pinned by full SHA (GEN-9); the trailing comment names the tag the
      # SHA was resolved from so bumps stay reviewable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      - run: make module-check

  site:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[ci only=') ||
      contains(github.event.head_commit.message, '[ci only=site]')
    runs-on: ubuntu-latest
    steps:
      # Pinned by full SHA (GEN-9); the trailing comment names the tag the
      # SHA was resolved from so bumps stay reviewable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # GEN-5: --ignore-scripts blocks install-time code execution;
      # lockfile-only installs (npm ci) plus signature audit below.
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm audit signatures
        working-directory: frontend
      # check:site drives a real browser over CDP; install an explicit
      # Chrome instead of relying on the runner image version.
      - id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - run: make site-check
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  # Keeps the single `gates` status check: green only when every split gate
  # passes. Skipped on `[ci only=...]` runs, where the one job reports for
  # itself.
  gates:
    if: always() && !contains(github.event.head_commit.message, '[ci only=')
    runs-on: ubuntu-latest
    needs: [test, lint, graphics, module, site]
    steps:
      - name: Require every gate to pass
        run: |
          fail=0
          for result in "test:${{ needs.test.result }}" "lint:${{ needs.lint.result }}" "graphics:${{ needs.graphics.result }}" "module:${{ needs.module.result }}" "site:${{ needs.site.result }}"; do
            echo "$result"
            case "$result" in *:success) ;; *) fail=1 ;; esac
          done
          exit "$fail"

  # Library race detector; examples run in independent shards below.
  test-race:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[ci only=') ||
      contains(github.event.head_commit.message, '[ci only=test-race]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      - run: make test-race
      - run: go test -p 1 -tags ownframe_debug ./internal/web
      - run: make soak-check SOAK_SECONDS=60

  # GEN-21: the security regression suite (TestSec_*) is its own gate,
  # so a reverted fix fails CI even when the rest stays green.
  sec:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[ci only=') ||
      contains(github.event.head_commit.message, '[ci only=sec]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      - run: go test -p 1 -count=1 -run Sec ./... ./examples/...
      # GEN-24: short fuzz smoke per target; sustained runs belong to
      # continuous fuzzing, not to this gate.
      - run: go test -count=1 -run=NONE -fuzz=FuzzReplace -fuzztime=15s ./internal/emoji/
      - run: go test -count=1 -run=NONE -fuzz=FuzzSanitizeLine -fuzztime=15s ./internal/web/
      - run: go test -count=1 -run=NONE -fuzz=FuzzBlockedIP -fuzztime=15s ./internal/fetch/
      - run: go test -count=1 -run=NONE -fuzz=FuzzMethodHeader -fuzztime=15s ./internal/fetch/
      - run: go test -count=1 -run=NONE -fuzz=FuzzDOMLimits -fuzztime=15s ./internal/page/
      - run: go test -count=1 -run=NONE -fuzz=FuzzImageSrc -fuzztime=15s ./internal/page/
      - run: go test -count=1 -run=NONE -fuzz=FuzzSetCrashDir -fuzztime=15s ./internal/crash/

  # GEN-25: 32-bit and ARM compile checks plus the checkptr
  # instrumented run catch overflow and unsafe misuse amd64 hides.
  cross:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[ci only=') ||
      contains(github.event.head_commit.message, '[ci only=cross]')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [386, arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      - run: GOARCH=${{ matrix.goarch }} go vet -p 1 ./internal/... .
      - run: GOOS=js GOARCH=wasm go vet -p 1 ./internal/... .
      - run: GOOS=windows go vet -p 1 ./internal/... .
      - run: GOOS=darwin go vet -p 1 ./internal/... .
      - run: go test -gcflags=all=-d=checkptr=2 -count=1 -run Sec ./internal/... .

  secrets:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[ci only=') ||
      contains(github.event.head_commit.message, '[ci only=secrets]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # GEN-10: gitleaks scans the full history for committed secrets.
      # Enable GitHub push protection too; see documentation/security.md.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-actions:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[ci only=') ||
      contains(github.event.head_commit.message, '[ci only=lint-actions]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # GEN-9: actionlint (pinned tarball, SHA checked) plus zizmor
      # (pinned PyPI version) keep new workflow edits honest.
      - name: Lint workflows with actionlint and zizmor
        run: |
          curl -sSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.9/actionlint_1.7.9_linux_amd64.tar.gz
          echo "233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint .github/workflows/*.yml
          python3 -m pip install --quiet "zizmor==1.31.1"
          zizmor .github/workflows

  # GEN-14: compare complete release archives across independent builds. See documentation/supply-chain.md.
  reproducible:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[ci only=') ||
      contains(github.event.head_commit.message, '[ci only=reproducible]')
    runs-on: ubuntu-latest
    steps:
      # Pinned by full SHA (GEN-9); the trailing comment names the tag the
      # SHA was resolved from so bumps stay reviewable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      - run: go mod verify
      - run: go mod download
      - run: cd examples && go mod download
      - run: bash scripts/reproducible-check.sh

  examples-race:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[ci only=') ||
      contains(github.event.head_commit.message, '[ci only=examples-race]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      - name: Run examples race shard
        env:
          RACE_SHARD: ${{ matrix.shard }}
        run: bash scripts/test-examples-race.sh "$RACE_SHARD" 4

  native-package:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[ci only=') ||
      contains(github.event.head_commit.message, '[ci only=native-package]')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Download both module graphs
        run: |
          go mod download
          cd examples && go mod download
      - name: Compile native cgo code and test clipboard with memory fixtures
        env:
          CGO_ENABLED: "1"
        run: |
          make build
          go test -p 1 ./internal/clipboard -run '^(TestMemoryRoundTrip|TestUTF16Clipboard|TestClearEmptiesMemory)$'
      - name: Package native host and wasm preview
        env:
          CGO_ENABLED: "1"
        run: |
          sh scripts/package.sh login
          python3 scripts/check-release-bundle.py dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-package-${{ matrix.os }}
          path: |
            dist/*-windows-*.zip
            dist/*-macos-*.zip
          if-no-files-found: error

  performance:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[ci only=') ||
      contains(github.event.head_commit.message, '[ci only=performance]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      - name: Compare parent and candidate on the same runner
        run: |
          set -eu
          mkdir -p temp/performance
          git worktree add --detach temp/performance/base HEAD^
          sh scripts/perf-baseline.sh --root temp/performance/base --exclude BenchmarkRedrawCold --out temp/performance/base.txt
          sh scripts/perf-baseline.sh --exclude BenchmarkRedrawCold --out temp/performance/candidate.txt --baseline temp/performance/base.json --max-ratio 1.5
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: performance-reports
          path: |
            temp/performance/*.txt
            temp/performance/*.json
          if-no-files-found: error

  android-bind:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[ci only=') ||
      contains(github.event.head_commit.message, '[ci only=android-bind]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install pinned Android binding tools and NDK
        run: |
          sdkmanager "platforms;android-34" "ndk;27.2.12479018"
          go install github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@v2.10.4
          go install github.com/ebitengine/gomobile/cmd/gobind@v0.0.0-20260820040257-d11f821a26a6
      - name: Compile Android arm64 binding
        run: |
          unset GOWORK
          mkdir -p temp/android-ci
          ebitenmobile bind -trimpath -target android/arm64 -javapkg com.chinmaysawant.telegram -o temp/android-ci/telegram.aar ./examples/telegram/mobile
          git rev-parse HEAD > temp/android-ci/source-commit.txt
          go list -m github.com/chinmay-sawant/blinkless > temp/android-ci/engine.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-arm64-binding
          path: temp/android-ci/
          if-no-files-found: error
